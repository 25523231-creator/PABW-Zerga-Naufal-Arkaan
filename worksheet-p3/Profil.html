    </tr>
    <tr>

    </tr>

  </tbody>
</table>
      <!-- tabel Anda nanti di sini (Lembar D) -->
      </section>
      <section id="bagian-2">
      <h2>Tambah Rutinitas</h2>
      <form action="/simpan" method="post">
    <p>
      <label for="nama-kolom">Jenis olahraga</label>
      <input type="text" id="nama-kolom" name="nama-kolom" required>
    </p>
    <p>
      <label for="waktu">Waktu</label>
      <input type="time" id="waktu" name="waktu" required>
    </p>
    <p>
      <label for="Durasi">Durasi</label>
      <input type="text" id="Durasi" name="Durasi" required>
    </p>
    <!-- tambahkan minimal dua kolom lagi -->
    <button type="submit">Simpan</button>
  </form>
      <!-- form Anda nanti di sini (Lembar E) -->

      <h2>About Me</h2>
      <p>Ini adalah bagian tentang saya.</p>
    </section>
  </main>
  <figure>
  <img src="foto.png"

</figure>
